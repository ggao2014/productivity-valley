name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependency tree
        run: |
          set +e
          for attempt in 1 2 3; do
            output="$(npm audit 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            # Registry/API blips (503/400/retired endpoint) should not block the job.
            if printf '%s' "$output" | grep -Eqi 'Service Unavailable|Bad Request|endpoint returned an error|endpoint is being retired|Invalid package tree'; then
              echo "npm audit attempt ${attempt} hit a registry/API error; retrying..."
              sleep $((attempt * 8))
              continue
            fi
            echo "npm audit reported a real dependency issue"
            exit "$status"
          done
          echo "npm audit still unavailable after retries; continuing"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check service worker syntax
        run: node --check public/sw.js
